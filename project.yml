name: cam
options:
  bundleIdPrefix: com.annayladesigns
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""

packages:
  Harbeth:
    url: https://github.com/yangKJ/Harbeth
    from: "0.2.6"
  SwiftUIPager:
    url: https://github.com/fermoya/SwiftUIPager
    from: "2.3.0"

targets:
  cam:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: cam
        excludes:
          - "**/.DS_Store"
    resources:
      - cam/Resources/Assets.xcassets
      - cam/Resources/LUTs
      - cam/Resources/Stickers
      - cam/Resources/Fonts
    dependencies:
      - package: Harbeth
        product: Harbeth
      - package: SwiftUIPager
        product: SwiftUIPager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.annayladesigns.cam
        INFOPLIST_FILE: cam/Resources/Info.plist
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
      debug:
        DEBUG_INFORMATION_FORMAT: dwarf
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      release:
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        SWIFT_OPTIMIZATION_LEVEL: "-O"
    scheme:
      testTargets: []
      gatherCoverageData: false
      # Lets the paywall show prices & run test purchases with no App Store Connect.
      storeKitConfiguration: cam.storekit
